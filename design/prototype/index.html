<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Nerds</title>
<meta name="description" content="Clickable design prototype for Coffee Nerds, a personal coffee brewing journal.">
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg:#f6efe4; --surface:#fffaf2; --surface-2:#efe4d2; --text:#2a1c13; --muted:#75604f; --border:#e0d0bb;
  --accent:#a3471f; --accent-hover:#8a3b19; --accent-ink:#fff; --accent-soft:#f5dccb;
  --good:#33663a; --good-soft:#dcebd8; --warn:#7a5308; --warn-soft:#f5e5bd;
  --rest:#41608f; --rest-soft:#dbe4f2; --bad:#963826; --bad-soft:#f3d5cd;
  --star:#cf9214;
  --shadow:0 1px 2px rgb(60 35 15 / .06), 0 6px 18px rgb(60 35 15 / .07);
  --radius:16px; --radius-sm:10px;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18110c; --surface:#221812; --surface-2:#2e2219; --text:#f2e6d8; --muted:#b39c88; --border:#3d2e23;
    --accent:#e27c4a; --accent-hover:#ee9061; --accent-ink:#1b0f08; --accent-soft:#40261a;
    --good:#8cc08a; --good-soft:#22341f; --warn:#e5b851; --warn-soft:#3b2e12;
    --rest:#93b2e3; --rest-soft:#1f2a3d; --bad:#ec8f7b; --bad-soft:#3d1f18;
    --star:#f0b43a; --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18110c; --surface:#221812; --surface-2:#2e2219; --text:#f2e6d8; --muted:#b39c88; --border:#3d2e23;
  --accent:#e27c4a; --accent-hover:#ee9061; --accent-ink:#1b0f08; --accent-soft:#40261a;
  --good:#8cc08a; --good-soft:#22341f; --warn:#e5b851; --warn-soft:#3b2e12;
  --rest:#93b2e3; --rest-soft:#1f2a3d; --bad:#ec8f7b; --bad-soft:#3d1f18;
  --star:#f0b43a; --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-body);padding-bottom:84px}
@media (min-width:760px){body{padding-bottom:0}}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.7rem)}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:inherit}
img,svg{display:block}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.container{max-width:1120px;margin:0 auto;padding:0 16px}
main.container{padding-top:24px;padding-bottom:48px}
section{margin-bottom:36px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.section-head a{color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.lede{font-size:1.08rem;color:var(--muted);max-width:52ch}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:12px}
.back:hover{color:var(--text)}

/* ---------- Header / nav ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .container{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.brand svg{color:var(--accent)}
.topnav{display:none;gap:4px;margin-left:12px}
.topnav a{text-decoration:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.topnav a:hover{color:var(--text);background:var(--surface-2)}
.topnav a[aria-current="page"]{color:var(--text);background:var(--surface-2)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.top-actions .btn.primary{display:none}
@media (min-width:760px){.topnav{display:flex}.top-actions .btn.primary{display:inline-flex}}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2)}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600;padding:4px 0}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar .fab{background:var(--accent);color:var(--accent-ink);width:52px;height:52px;border-radius:999px;display:grid;place-items:center;margin:-22px auto 0;box-shadow:var(--shadow)}
.tabbar a.brew-tab{color:var(--text)}
@media (min-width:760px){.tabbar{display:none}}

/* ---------- Buttons, chips, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 .95rem var(--font-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{min-height:36px;padding:0 14px;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.78rem;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.rest{background:var(--rest-soft);color:var(--rest)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.plain{background:var(--surface-2);color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--border)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.card .card-foot{position:relative;z-index:1}
.card:has(h3 a:hover){border-color:var(--accent)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.scroller>*{scroll-snap-align:start}
@media (min-width:1000px){.scroller{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}}
.two-col{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.two-col>*,.detail-layout>*,.guide>*{min-width:0}
@media (min-width:900px){.two-col{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.detail-layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.detail-layout{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}}

.coffee-card .bag{display:flex;gap:14px;align-items:flex-start}
.coffee-card p{margin:0}
.coffee-card .chips{margin-top:12px}

.recipe-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--accent)}
.specs{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.specs li{background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column}
.specs b{font-variant-numeric:tabular-nums;font-size:1.02rem}
.specs span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.specs.big{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.specs.big li{padding:12px 14px}
.specs.big b{font-size:1.3rem;font-family:var(--font-display)}

/* ---------- Hero ---------- */
.hero{display:grid;gap:24px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--border);border-radius:24px;padding:28px 22px;margin-bottom:36px}
@media (min-width:900px){.hero{grid-template-columns:1.4fr 1fr;align-items:center;padding:40px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.stats div{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.stats dt{font-size:.75rem;color:var(--muted);font-weight:600}
.stats dd{margin:0;font:600 1.7rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}

/* ---------- Lists ---------- */
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.brew-row{display:flex;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;border-bottom:1px solid var(--border)}
.list>:last-child,.list>:last-child .brew-row{border-bottom:0}
a.brew-row:hover,summary.brew-row:hover{background:var(--surface-2)}
.brew-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brew-row .muted{display:block;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.method-icon{width:42px;height:42px;flex:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
details.brew>summary{list-style:none;cursor:pointer}
details.brew>summary::-webkit-details-marker{display:none}
details.brew[open]>summary{background:var(--surface-2)}
.brew-body{padding:4px 16px 18px 72px;border-bottom:1px solid var(--border);display:grid;gap:14px}
@media (max-width:560px){.brew-body{padding-left:16px}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:0}
.kv div{background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px}
.kv dt{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.delta{font-size:.75rem;color:var(--accent);font-weight:700}
.sensory{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:.85rem;max-width:360px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:0}
.next{border-left-color:var(--good)}

dl.details{display:grid;grid-template-columns:minmax(120px,40%) 1fr;margin:0}
dl.details dt,dl.details dd{padding:10px 0;border-bottom:1px solid var(--border);margin:0}
dl.details dt{color:var(--muted);font-size:.9rem}
dl.details dd{font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- Filters / segmented ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.segmented a,.segmented label{padding:7px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.segmented a[aria-current="true"],.segmented input:checked+label{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.segmented input{position:absolute;opacity:0;pointer-events:none}
.segmented input:focus-visible+label{outline:3px solid var(--accent)}
.search{flex:1;min-width:200px}

/* ---------- Forms ---------- */
form fieldset{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:18px;margin:0 0 18px}
legend{font-family:var(--font-display);font-weight:600;font-size:1.1rem;padding:0 6px}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field>span:first-child{font-size:.85rem;font-weight:600}
.req{color:var(--accent)}
.hint{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=email],input[type=password],input[type=url],input[type=search],select,textarea{
  font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.input-unit{position:relative}
.input-unit input{padding-right:38px}
.input-unit i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:.85rem;pointer-events:none}
.ratio-out{display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--accent-soft);border-radius:var(--radius-sm);min-height:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:84px;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
@media (min-width:760px){.form-actions{bottom:0}}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:22px;text-align:center;color:var(--muted);font-size:.9rem}

.star-input{display:inline-flex;flex-direction:row-reverse;gap:4px;align-self:flex-start}
.star-input input{position:absolute;opacity:0;width:1px;height:1px}
.star-input label{font-size:2.1rem;line-height:1;color:var(--border);cursor:pointer;padding:2px}
.star-input input:checked~label,.star-input label:hover,.star-input label:hover~label{color:var(--star)}
.star-input input:focus-visible+label{outline:3px solid var(--accent);border-radius:6px}
.slider{display:grid;grid-template-columns:96px 1fr 28px;align-items:center;gap:10px}
.slider input{accent-color:var(--accent);width:100%}
.slider output{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.slider-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-left:106px;margin-right:38px}

.step-editor{display:grid;gap:8px}
.step-row{display:grid;grid-template-columns:80px 1fr 96px 40px;gap:8px;align-items:center}
@media (max-width:560px){.step-row{grid-template-columns:72px 1fr 40px}.step-row .water{grid-column:2}}

/* ---------- Wizard ---------- */
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 24px;counter-reset:s}
.stepper li{flex:1;counter-increment:s}
.stepper a,.stepper span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:600;height:100%}
.stepper a::before,.stepper span::before{content:counter(s);width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:.78rem}
.stepper .done{color:var(--text)}
.stepper .done::before{content:"✓";background:var(--good);color:var(--surface)}
.stepper .current{background:var(--accent-soft);color:var(--accent)}
.stepper .current::before{background:var(--accent);color:var(--accent-ink)}
.stepper small{display:block;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.stepper small{display:none}}
.pick{display:block;text-decoration:none}
.pick.card:hover{border-color:var(--accent)}
.summary-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface-2);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;font-size:.9rem}
.summary-bar a{color:var(--accent);font-weight:600}
.callout{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
.callout h3{margin-bottom:4px}

/* ---------- Recipe steps ---------- */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);align-items:baseline}
.timeline .t{font:700 .95rem var(--font-mono);color:var(--accent)}
.timeline .w{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.timeline li.prep .t{color:var(--muted);font-family:var(--font-body);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.timeline li.done{opacity:.45}
.timeline li.now{background:var(--accent-soft);margin:0 -14px;padding:14px;border-radius:var(--radius-sm);border-bottom-color:transparent}

/* ---------- Brew guide ---------- */
.guide{display:grid;gap:24px}
@media (min-width:900px){.guide{grid-template-columns:1.1fr 1fr;align-items:start}}
.guide-panel{text-align:center;padding:28px 20px}
.clock{font:600 clamp(4.2rem,16vw,6.6rem)/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:16px 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.now-card{background:var(--surface-2);border-radius:var(--radius);padding:18px;margin:18px 0;text-align:left}
.now-card .target{font:700 2.2rem/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.now-card .next:empty{display:none}
.now-card .next{margin-top:12px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px}
.controls{display:flex;gap:10px;justify-content:center}
.controls .btn{min-width:120px;min-height:52px;font-size:1.05rem}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:40px 20px;border:2px dashed var(--border);border-radius:var(--radius);color:var(--muted)}
.empty h3{color:var(--text)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){.toast{bottom:28px}}
footer{border-top:1px solid var(--border);padding:20px 0 28px;color:var(--muted);font-size:.85rem}
footer .container{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
footer button{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
.auth{max-width:420px;margin:24px auto}
.page-head{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.page-head p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="container">
    <a class="brand" href="#/" aria-label="Coffee Nerds home">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

<script>
"use strict";
/* ================= Helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 864e5;
const pad = n => String(n).padStart(2, "0");
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localDateTime = d => `${localDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const daysAgo = (n, h = 8, m = 0) => { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d; };
const parseLocalDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtTime = sec => sec == null ? "—" : `${Math.floor(sec / 60)}:${pad(Math.floor(sec % 60))}`;
const parseTime = s => { s = String(s || "").trim(); if (!s) return null; const m = s.match(/^(\d+):(\d{1,2})$/); return m ? (+m[1]) * 60 + (+m[2]) : (isNaN(+s) ? null : +s * 60); };
const ratio = (dose, water) => dose > 0 && water > 0 ? "1:" + (water / dose).toFixed(1).replace(/\.0$/, "") : "—";
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function daysOffRoast(c) {
  if (!c.roastDate) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((today - parseLocalDate(c.roastDate)) / DAY);
}
function freshness(c) {
  const d = daysOffRoast(c);
  if (d == null) return `<span class="badge plain">No roast date</span>`;
  const [cls, label] = d < 4 ? ["rest", "Resting"] : d <= 30 ? ["good", "Sweet spot"] : d <= 60 ? ["warn", "Past peak"] : ["bad", "Stale"];
  return `<span class="badge ${cls}" title="${label}">${d} day${d === 1 ? "" : "s"} off roast</span>`;
}
function stars(n) {
  return `<span class="stars" aria-label="${n} out of 5 stars">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
}
function relDate(iso) {
  const d = new Date(iso); const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / DAY);
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const day = diff === 0 ? "Today" : diff === 1 ? "Yesterday" : diff < 7 ? `${diff} days ago` : d.toLocaleDateString("en", { day: "numeric", month: "short" });
  return `${day}, ${time}`;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }

const ICONS = {
  v60: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16l-6 9h-4z"/><path d="M7 19h10M12 15v4M20 8h1.5"/></svg>`,

    dose: 11, water: 200, temp: 100, tempLabel: "Just off the boil", grind: "Medium-fine", grindNote: "fine side of medium", total: 180, filter: "Paper, no rinse needed", builtin: true,

  const coffees = [

    { id: "c-huila", name: "Huila El Paraíso — Pink Bourbon", roaster: "Moinho Torrefação", country: "Colombia", region: "Huila", farm: "Finca El Paraíso", variety: "Pink Bourbon", process: "Honey", altitude: 1750, roastLevel: "Light", roastDate: roasted(2), roasterNotes: "Red berries, panela, cacao nibs", sca: 87, form: "Whole bean", bagWeight: 250, price: "R$ 78.00", purchaseDate: roasted(1), notes: "Let it rest a few days before brewing.", status: "active" },

/* ================= State (in-memory + best-effort localStorage) ================= */
const STORE_KEY = "coffee-nerds-proto-v1";
let state;
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || seed(); } catch { state = seed(); }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* private mode: keep in memory */ } }

const allRecipes = () => [...BUILTIN_RECIPES, ...state.recipes];
const getRecipe = id => allRecipes().find(r => r.id === id);
const getCoffee = id => state.coffees.find(c => c.id === id);
const getMethod = id => METHODS.find(m => m.id === id);
const byDateDesc = (a, b) => new Date(b.date) - new Date(a.date);
const brewsFor = pred => state.brews.filter(pred).sort(byDateDesc);
const bestBrew = coffeeId => brewsFor(b => b.coffeeId === coffeeId).sort((a, b) => b.rating - a.rating || byDateDesc(a, b))[0];
const tempText = r => r.temp ? `${r.temp} °C` : "—";

/* ================= Shared components ================= */
function coffeeCard(c, { brewBtn = true } = {}) {
  const count = state.brews.filter(b => b.coffeeId === c.id).length;
  const best = bestBrew(c.id);
  return `<article class="card coffee-card">
    <div class="bag">${bagArt(c)}
      <div class="grow">
        <h3><a href="#/coffees/${c.id}">${esc(c.name)}</a></h3>
        <p class="muted small">${esc(c.roaster)} · ${esc(c.country)}</p>
      </div>
    </div>
    <div class="chips">${c.process ? `<span class="chip">${esc(c.process)}</span>` : ""}${c.roastLevel ? `<span class="chip">${esc(c.roastLevel)}</span>` : ""}<span class="chip">${count} brew${count === 1 ? "" : "s"}${best ? ` · best ${best.rating}★` : ""}</span></div>

      ${brewBtn && c.status === "active" ? `<a class="btn small" href="#/brew/new?coffee=${c.id}">Brew</a>` : ""}</div>
  </article>`;
}
function brewLink(b) {
  const c = getCoffee(b.coffeeId), r = getRecipe(b.recipeId);
  return `<a class="brew-row" href="#/history?open=${b.id}">
    <span class="method-icon">${ICONS[r?.methodId] || ""}</span>
    <span class="grow"><strong>${esc(c?.name || "Deleted coffee")}</strong><span class="muted">${esc(r?.name || "Deleted recipe")} · ${relDate(b.date)}</span></span>
    ${stars(b.rating)}
  </a>`;
}
function recipeCard(r) {
  const m = getMethod(r.methodId);
  return `<article class="card recipe-card">
    <div class="top">${ICONS[r.methodId]}<span class="tag">${r.builtin ? "🔒 Built-in" : "★ My recipe"}</span></div>
    <h3><a href="#/recipes/${r.id}">${esc(r.name)}</a></h3>
    <p class="muted small" style="margin:0">${esc(m.name)} · ${esc(r.author || "You")}</p>

      <li><b>${r.water} g</b><span>Water</span></li>
      <li><b>${ratio(r.dose, r.water)}</b><span>Ratio</span></li>
      <li><b>${tempText(r)}</b><span>Temp</span></li>
      <li><b>${r.totalLabel || fmtTime(r.total)}</b><span>Time</span></li>
      <li><b style="font-size:.85rem">${esc(r.grind)}</b><span>Grind</span></li>
    </ul>
    <div class="card-foot"><a class="btn small primary" href="#/guide/${r.id}">▶ Brew guide</a><a class="btn small ghost" href="#/brew/new?recipe=${r.id}">Log a brew</a></div>
  </article>`;
}
function timeline(r, { live = false } = {}) {
  return `<ol class="timeline" ${live ? 'id="tl"' : ""}>${r.steps.map((s, i) => `
    <li class="${s.at == null ? "prep" : ""}" data-i="${i}">
      <span class="t">${s.at == null ? "Prep" : fmtTime(s.at)}</span>
      <span>${esc(s.text)}</span>
      <span class="w">${s.water ? `${s.water} g` : ""}</span>
    </li>`).join("")}</ol>`;
}
function emptyState(title, body, action = "") {
  return `<div class="empty"><h3>${title}</h3><p>${body}</p>${action}</div>`;
}

/* ================= Views ================= */
function viewHome() {

  const from = q.get("from") ? getRecipe(q.get("from")) : null;
  const base = editing || (from ? { ...from, name: `${from.name} (my version)`, author: from.author ? `Based on ${from.author}` : "" } :
    { methodId: q.get("method") || "v60", dose: 15, water: 250, temp: 94, grind: "Medium", total: 180, steps: [{ at: 0, text: "Bloom", water: 45 }, { at: 45, text: "Pour to 250 g", water: 250 }] });

  const stepRow = (s = {}) => `<div class="step-row">
      <input type="text" name="st" aria-label="Time (m:ss or Prep)" placeholder="0:00" value="${s.at == null ? (s.text ? "Prep" : "") : fmtTime(s.at)}">
      <input type="text" name="sa" aria-label="Action" placeholder="What to do" value="${esc(s.text || "")}">
      <div class="input-unit water"><input type="number" name="sw" aria-label="Water target (g)" min="0" placeholder="target" value="${s.water ?? ""}"><i>g</i></div>
      <button type="button" class="icon-btn" data-remove aria-label="Remove step">✕</button>
    </div>`;
  app.innerHTML = `
    <a class="back" href="${editing ? `#/recipes/${id}` : from ? `#/recipes/${from.id}` : "#/recipes"}">← Back</a>
    <div class="page-head"><div><h1>${editing ? "Edit recipe" : from ? "Duplicate recipe" : "New recipe"}</h1>

      <fieldset><legend>Basics</legend><div class="fields">
        ${field("Name", `<input type="text" name="name" required value="${esc(base.name || "")}" placeholder="My everyday V60">`, { req: true, full: true })}
        ${field("Method", `<select name="methodId" required>${METHODS.map(m => `<option value="${m.id}" ${m.id === base.methodId ? "selected" : ""}>${m.name}</option>`).join("")}</select>`, { req: true })}
        ${field("Author / Source", `<input type="text" name="author" value="${esc(base.author || "")}" placeholder="Name or link">`)}
      </div></fieldset>
      <fieldset><legend>Parameters</legend><div class="fields">
        ${field("Coffee dose", `<div class="input-unit"><input type="number" name="dose" required min="1" step="0.1" value="${base.dose}"><i>g</i></div>`, { req: true })}
        ${field("Water", `<div class="input-unit"><input type="number" name="water" required min="1" value="${base.water}"><i>g</i></div>`, { req: true })}
        <div class="field"><span>Ratio</span><output class="ratio-out" id="ratio">${ratio(base.dose, base.water)}</output><span class="hint">Calculated from dose and water</span></div>
        ${field("Water temperature", `<div class="input-unit"><input type="number" name="temp" min="60" max="100" value="${base.temp ?? ""}"><i>°C</i></div>`, { hint: "100 = just off the boil" })}
        ${field("Grind size", `<select name="grind" required>${GRIND.map(g => opt(g, base.grind)).join("")}</select>`, { req: true })}
        ${field("Total brew time", `<input type="text" name="total" value="${base.total ? fmtTime(base.total) : ""}" placeholder="3:30" pattern="\\d+:\\d{2}">`, { hint: "m:ss" })}
      </div></fieldset>
      <fieldset><legend>Steps</legend>
        <p class="hint" style="margin-top:0">Time mark (m:ss, or “Prep”), what to do, and the scale target in grams. The brew guide reads these.</p>
        <div class="step-editor" id="steps">${base.steps.map(stepRow).join("")}</div>
        <button type="button" class="btn small" id="add-step" style="margin-top:12px">+ Add step</button>
      </fieldset>
      <div class="form-actions"><a class="btn ghost" href="#/recipes">Cancel</a><button class="btn primary" type="submit">Save recipe</button></div>
    </form>`;
  const f = $("#f");
  const upd = () => { $("#ratio").textContent = ratio(+f.dose.value, +f.water.value); };
  f.dose.addEventListener("input", upd); f.water.addEventListener("input", upd);
  $("#add-step").addEventListener("click", () => { $("#steps").insertAdjacentHTML("beforeend", stepRow()); $("#steps").lastElementChild.querySelector("input").focus(); });
  $("#steps").addEventListener("click", e => { if (e.target.closest("[data-remove]")) e.target.closest(".step-row").remove(); });
  f.addEventListener("submit", e => {
    e.preventDefault();
    const steps = $$(".step-row", f).map(row => {
      const [t, a, w] = $$("input", row).map(i => i.value.trim());
      return { at: /^prep$/i.test(t) || !t ? null : parseTime(t), text: a, water: w ? +w : undefined };
    }).filter(s => s.text).sort((a, b) => (a.at ?? -1) - (b.at ?? -1));
    const fd = new FormData(f);
    const data = { name: fd.get("name").trim(), methodId: fd.get("methodId"), author: fd.get("author").trim(), dose: +fd.get("dose"), water: +fd.get("water"),
      temp: fd.get("temp") ? +fd.get("temp") : null, grind: fd.get("grind"), total: parseTime(fd.get("total")), steps, builtin: false,

    else { rid = uid("r-"); state.recipes.push({ ...data, id: rid }); }
    save(); toast("Recipe saved"); location.hash = `#/recipes/${rid}`;
  });
}

  const step = !coffee ? 1 : !recipe ? 2 : 3;
  const stepper = `<ol class="stepper" aria-label="Progress">
    <li>${step === 1 ? `<span class="current" aria-current="step">Coffee</span>` : `<a class="done" href="${link({ coffee: null })}">Coffee<small>${esc(coffee.name)}</small></a>`}</li>
    <li>${step === 2 ? `<span class="current" aria-current="step">Recipe</span>` : recipe && coffee ? `<a class="done" href="${link({ recipe: null })}">Recipe<small>${esc(recipe.name)}</small></a>` : `<span>Recipe${recipe ? `<small>${esc(recipe.name)}</small>` : ""}</span>`}</li>
    <li>${step === 3 ? `<span class="current" aria-current="step">Brew &amp; rate</span>` : `<span>Brew &amp; rate</span>`}</li>
  </ol>`;
  let body = "";
  if (step === 1) {
    const active = state.coffees.filter(c => c.status === "active");
    body = `<h1>Which coffee?</h1><p class="muted">Pick the bag you're brewing.${recipe ? ` Recipe: <b>${esc(recipe.name)}</b>.` : ""}</p>
      ${active.length ? `<div class="grid">${active.map(c => `<a class="pick card coffee-card" href="${link({ coffee: c.id })}">
        <div class="bag">${bagArt(c)}<div class="grow"><h3>${esc(c.name)}</h3><p class="muted small">${esc(c.roaster)} · ${esc(c.country)}</p></div></div>
        <div class="card-foot">${freshness(c)}<span class="muted small">${esc(c.form)}</span></div></a>`).join("")}</div>` : ""}
      <p style="margin-top:18px"><a class="btn" href="#/coffees/new">+ Add a new coffee</a></p>`;
  } else if (step === 2) {
    const best = bestBrew(coffee.id);
    body = `<h1>Which recipe?</h1><p class="muted">For <b>${esc(coffee.name)}</b>.</p>
      ${best ? `<div class="callout"><p class="tag" style="color:var(--good)">Your best with this coffee</p><h3>${esc(getRecipe(best.recipeId)?.name || "")}</h3>
        <p class="small" style="margin-bottom:10px">${stars(best.rating)} · ${esc(best.grinder || "")}${best.next ? ` · Next time: “${esc(best.next)}”` : ""}</p>
        <a class="btn small primary" href="${link({ recipe: best.recipeId })}">Use this recipe</a></div>` : ""}
      ${METHODS.map(m => `<section><h2 class="row" style="gap:8px">${ICONS[m.id]} ${m.name}</h2><div class="grid">
        ${allRecipes().filter(r => r.methodId === m.id).map(r => `<a class="pick card" href="${link({ recipe: r.id })}">
          <p class="tag" style="margin:0 0 4px">${r.builtin ? "🔒 Built-in" : "★ My recipe"}</p><h3>${esc(r.name)}</h3>
          <p class="muted small" style="margin:0">${r.dose} g · ${r.water} g · ${ratio(r.dose, r.water)} · ${tempText(r)} · ${esc(r.grind)}</p></a>`).join("")}
      </div></section>`).join("")}`;
  } else {
    const last = brewsFor(b => b.coffeeId === coffee.id && b.recipeId === recipe.id)[0];
    const grinderGuess = last?.grinder || brewsFor(() => true)[0]?.grinder || "";
    body = `<h1>Brew &amp; rate</h1>
      <div class="summary-bar"><span>☕ <b>${esc(coffee.name)}</b></span><span>${ICONS[recipe.methodId]}</span><span><b>${esc(recipe.name)}</b></span>
        <a href="#/guide/${recipe.id}?coffee=${coffee.id}">▶ Open brew guide</a></div>
      ${last?.next ? `<div class="callout"><p class="tag" style="color:var(--good)">Last time you said</p><p style="margin:0">“${esc(last.next)}”</p></div>` : ""}
      <form id="f" autocomplete="off">
        <fieldset><legend>What you actually did</legend>
          <p class="hint" style="margin-top:0">Pre-filled from the recipe. Change anything you did differently.</p>
          <div class="fields">
            ${field("Date &amp; time", `<input type="datetime-local" name="date" required value="${localDateTime(new Date())}">`, { req: true })}
            ${field("Dose", `<div class="input-unit"><input type="number" name="dose" step="0.1" value="${recipe.dose}"><i>g</i></div>`, { hint: `Recipe: ${recipe.dose} g` })}
            ${field("Water", `<div class="input-unit"><input type="number" name="water" value="${recipe.water}"><i>g</i></div>`, { hint: `Recipe: ${recipe.water} g` })}
            <div class="field"><span>Ratio</span><output class="ratio-out" id="ratio">${ratio(recipe.dose, recipe.water)}</output></div>
            ${field("Temperature", `<div class="input-unit"><input type="number" name="temp" value="${recipe.temp ?? ""}"><i>°C</i></div>`, { hint: `Recipe: ${tempText(recipe)}` })}
            ${field("Grinder + setting", `<input type="text" name="grinder" value="${esc(grinderGuess)}" placeholder="Comandante — 24 clicks">`, { hint: `Recipe: ${esc(recipe.grind)}` })}
            ${field("Actual total time", `<input type="text" name="time" placeholder="${fmtTime(recipe.total)}" pattern="\\d+:\\d{2}">`, { hint: "m:ss" })}
          </div></fieldset>
        <fieldset><legend>How did it taste?</legend>
          <div class="field" style="margin-bottom:18px"><span>Rating <span class="req" aria-hidden="true">*</span></span>
            <div class="star-input" role="radiogroup" aria-label="Rating">${[5, 4, 3, 2, 1].map(n => `<input type="radio" id="s${n}" name="rating" value="${n}" ${n === 5 ? "required" : ""}><label for="s${n}" title="${n} star${n > 1 ? "s" : ""}"><span class="sr-only">${n} star${n > 1 ? "s" : ""}</span><span aria-hidden="true">★</span></label>`).join("")}</div></div>
          <div class="stack" style="margin-bottom:18px">
            ${["Acidity", "Sweetness", "Body", "Bitterness"].map(s => `<label class="slider"><span class="small" style="font-weight:600">${s}</span><input type="range" name="${s.toLowerCase()}" min="1" max="5" value="3" oninput="this.nextElementSibling.value=this.value"><output>3</output></label>`).join("")}
            <div class="slider-scale"><span>low</span><span>high</span></div>
          </div>
          <div class="fields">
            ${field("Tasting notes", `<textarea name="notes" placeholder="Sweet, a bit sour at the end…"></textarea>`, { full: true })}
            ${field("What to change next time", `<input type="text" name="next" placeholder="Grind 2 clicks finer">`, { full: true, hint: "This shows up the next time you brew this coffee." })}
          </div></fieldset>
        <div class="form-actions"><a class="btn ghost" href="${link({ recipe: null })}">Back</a><button class="btn primary" type="submit">Save brew</button></div>
      </form>`;
  }
  app.innerHTML = stepper + body;
  const f = $("#f");
  if (!f) return;
  const upd = () => { $("#ratio").textContent = ratio(+f.dose.value, +f.water.value); };
  f.dose.addEventListener("input", upd); f.water.addEventListener("input", upd);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const b = { id: uid("b-"), date: new Date(d.date).toISOString(), coffeeId: coffee.id, recipeId: recipe.id, dose: +d.dose, water: +d.water, temp: d.temp ? +d.temp : null,
      grinder: d.grinder, time: parseTime(d.time), rating: +d.rating, notes: d.notes, next: d.next,
      sensory: { acidity: +d.acidity, sweetness: +d.sweetness, body: +d.body, bitterness: +d.bitterness } };
    state.brews.push(b); save(); toast("Brew saved to your journal");
    location.hash = `#/history?open=${b.id}`;
  });
}

let guideTimer = null, wakeLock = null;
function stopGuide() { clearInterval(guideTimer); guideTimer = null; try { wakeLock?.release(); } catch { } wakeLock = null; }
function viewGuide(id, q) {
  const r = getRecipe(id);
  if (!r) return notFound();
  document.title = `Brew guide: ${r.name} · Coffee Nerds`;
  const coffee = getCoffee(q.get("coffee"));
  const timed = r.steps.map((s, i) => ({ ...s, i })).filter(s => s.at != null);
  const prep = r.steps.filter(s => s.at == null);
  const total = Math.max(r.total || 0, ...timed.map(s => s.at));
  let elapsed = 0, startedAt = null;
  app.innerHTML = `
    <a class="back" href="#/recipes/${r.id}">← ${esc(r.name)}</a>
    <div class="guide">
      <div class="card guide-panel">
        <p class="eyebrow">${getMethod(r.methodId).name} brew guide</p>
        <h1 style="font-size:1.6rem">${esc(r.name)}</h1>
        <p class="muted small" style="margin:0">${r.dose} g coffee · ${r.water} g water · ${ratio(r.dose, r.water)} · ${tempText(r)} · ${esc(r.grind)}${coffee ? ` · ${esc(coffee.name)}` : ""}</p>
        <div class="clock" id="clock" role="timer" aria-live="off">0:00</div>
        <div class="progress" aria-hidden="true"><i id="prog"></i></div>
        <div class="now-card" aria-live="polite">
          <p class="tag" id="now-label" style="margin-bottom:6px">Get ready</p>
          <p id="now-text" style="font-size:1.1rem;font-weight:600">${prep.length ? "Do the prep, then press Start when the first water hits the coffee." : "Press Start when the first water hits the coffee."}</p>
          <p class="target" id="target" style="margin:0"></p>
          <p class="next" id="next"></p>
        </div>
        <div class="controls">
          <button class="btn primary" id="start" type="button">Start</button>
          <button class="btn" id="reset-t" type="button">Reset</button>
        </div>
        <div id="done" hidden style="margin-top:18px"><p><b>Done! How did it taste?</b></p><a class="btn primary block" href="#/brew/new?recipe=${r.id}${coffee ? `&coffee=${coffee.id}` : ""}">Log this brew</a></div>
      </div>
      <section class="card"><h2>Steps</h2>${timeline(r, { live: true })}<p class="hint" style="margin-top:12px">The screen stays on while the timer runs, where the browser supports it.</p></section>
    </div>`;
  const els = { clock: $("#clock"), prog: $("#prog"), label: $("#now-label"), text: $("#now-text"), target: $("#target"), next: $("#next"), start: $("#start"), done: $("#done") };
  const lis = $$("#tl li");
  function paint() {
    const t = startedAt ? elapsed + (Date.now() - startedAt) / 1000 : elapsed;
    els.clock.textContent = fmtTime(t);
    els.prog.style.width = Math.min(100, t / total * 100) + "%";
    const curIdx = timed.findLastIndex(s => s.at <= t);
    const cur = timed[curIdx], nxt = timed[curIdx + 1];
    if (t > 0 || startedAt) {
      if (cur) {
        els.label.textContent = `Step ${curIdx + 1} of ${timed.length} · ${fmtTime(cur.at)}`;
        els.text.textContent = cur.text;
      }
      const water = timed.slice(0, curIdx + 1).reverse().find(s => s.water)?.water;
      els.target.textContent = water ? `Scale: ${water} g` : "";
      els.next.textContent = nxt ? `Next in ${fmtTime(nxt.at - t)}: ${nxt.text}` : "";
    }
    lis.forEach(li => {
      const s = r.steps[+li.dataset.i];
      li.classList.toggle("now", !!cur && s === r.steps[cur.i]);
      li.classList.toggle("done", s.at != null && !!cur && s.at < cur.at);
    });
    if (t >= total && startedAt) { pause(); els.done.hidden = false; els.start.textContent = "Resume"; }
  }
  async function start() {
    startedAt = Date.now(); els.start.textContent = "Pause"; els.done.hidden = true;
    guideTimer = setInterval(paint, 200); paint();
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { }
  }
  function pause() { if (startedAt) elapsed += (Date.now() - startedAt) / 1000; startedAt = null; stopGuide(); els.start.textContent = "Resume"; }
  els.start.addEventListener("click", () => startedAt ? pause() : start());
  $("#reset-t").addEventListener("click", () => { pause(); elapsed = 0; els.start.textContent = "Start"; els.done.hidden = true;
    els.label.textContent = "Get ready"; els.text.textContent = "Press Start when the first water hits the coffee."; els.target.textContent = ""; els.next.textContent = ""; paint(); });
  paint();
}

function viewHistory(q) {
  document.title = "History · Coffee Nerds";
  const open = q.get("open");
  app.innerHTML = `
    <div class="page-head"><div><h1>History</h1><p class="muted">Every cup you've logged. Filter to find the best way to brew a coffee.</p></div></div>
    <div class="toolbar">
      <select id="fc" aria-label="Coffee" style="width:auto;flex:1;min-width:180px"><option value="">All coffees</option>${state.coffees.map(c => `<option value="${c.id}" ${q.get("coffee") === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      <select id="fm" aria-label="Method" style="width:auto"><option value="">All methods</option>${METHODS.map(m => `<option value="${m.id}">${m.name}</option>`).join("")}</select>
      <select id="fr" aria-label="Minimum rating" style="width:auto"><option value="0">Any rating</option><option value="5">★★★★★ only</option><option value="4">★★★★ and up</option><option value="3">★★★ and up</option></select>
      <select id="fs" aria-label="Sort" style="width:auto"><option value="new">Newest first</option><option value="best">Best rated first</option></select>
    </div>
    <div id="best"></div>
    <div id="results"></div>`;
  const render = () => {
    const fc = $("#fc").value, fm = $("#fm").value, fr = +$("#fr").value, fs = $("#fs").value;
    let list = state.brews.filter(b => (!fc || b.coffeeId === fc) && (!fm || getRecipe(b.recipeId)?.methodId === fm) && b.rating >= fr).sort(byDateDesc);
    if (fs === "best") list.sort((a, b) => b.rating - a.rating || byDateDesc(a, b));
    const best = fc && bestBrew(fc);
    $("#best").innerHTML = best ? `<div class="callout"><p class="tag" style="color:var(--good)">Best way to brew ${esc(getCoffee(fc).name)}</p>
      <h3>${esc(getRecipe(best.recipeId)?.name || "")} · ${stars(best.rating)}</h3>
      <p class="small" style="margin:0">${best.dose} g / ${best.water} g (${ratio(best.dose, best.water)}) · ${best.temp ?? "—"} °C · ${esc(best.grinder || "")} · ${fmtTime(best.time)}</p></div>` : "";
    $("#results").innerHTML = list.length ? `<div class="list">${list.map(b => brewDetails(b, b.id === open)).join("")}</div>` :
      emptyState("No brews match", "Try loosening the filters, or log a new brew.", `<a class="btn primary" href="#/brew/new">+ Log a brew</a>`);
  };
  $$(".toolbar select").forEach(s => s.addEventListener("change", render));
  render();
  if (open) document.getElementById(`brew-${open}`)?.scrollIntoView({ block: "center" });
}
function brewDetails(b, open) {
  const c = getCoffee(b.coffeeId), r = getRecipe(b.recipeId);
  const diff = (v, rv, unit) => v != null && rv != null && v !== rv ? ` <span class="delta">${v > rv ? "+" : ""}${+(v - rv).toFixed(1)}${unit}</span>` : "";
  return `<details class="brew" id="brew-${b.id}" ${open ? "open" : ""}>
    <summary class="brew-row">
      <span class="method-icon">${ICONS[r?.methodId] || ""}</span>
      <span class="grow"><strong>${esc(c?.name || "Deleted coffee")}</strong><span class="muted">${esc(r?.name || "")} · ${relDate(b.date)}</span></span>
      ${stars(b.rating)}
    </summary>
    <div class="brew-body">
      <dl class="kv">
        <div><dt>Dose</dt><dd>${b.dose} g${diff(b.dose, r?.dose, " g")}</dd></div>
        <div><dt>Water</dt><dd>${b.water} g${diff(b.water, r?.water, " g")}</dd></div>
        <div><dt>Ratio</dt><dd>${ratio(b.dose, b.water)}</dd></div>
        <div><dt>Temp</dt><dd>${b.temp ?? "—"} °C${diff(b.temp, r?.temp, "°")}</dd></div>
        <div><dt>Grind</dt><dd>${esc(b.grinder || "—")}</dd></div>
        <div><dt>Time</dt><dd>${fmtTime(b.time)}</dd></div>
      </dl>
      ${b.sensory ? `<div class="sensory">${Object.entries(b.sensory).map(([k, v]) => `<span style="text-transform:capitalize">${k}</span><span class="bar"><i style="width:${v * 20}%"></i></span><span class="num">${v}</span>`).join("")}</div>` : ""}
      ${b.notes ? `<p class="note">${esc(b.notes)}</p>` : ""}
      ${b.next ? `<p class="note next"><b>Next time:</b> ${esc(b.next)}</p>` : ""}
      <div class="row">${c?.status === "active" ? `<a class="btn small primary" href="#/brew/new?coffee=${b.coffeeId}&recipe=${b.recipeId}">Brew this again</a>` : ""}<a class="btn small ghost" href="#/coffees/${b.coffeeId}">View coffee</a><a class="btn small ghost" href="#/recipes/${b.recipeId}">View recipe</a></div>
    </div>
  </details>`;
}

function viewSignIn() {
  document.title = "Sign in · Coffee Nerds";
  app.innerHTML = `<div class="auth card">
    <h1 style="font-size:1.8rem">Welcome back</h1>
    <p class="muted">Your coffee journal is private. Only you can see your coffees, recipes and brews.</p>
    <form id="f" class="stack">
      ${field("Email", `<input type="email" name="email" required autocomplete="email">`)}
      ${field("Password", `<input type="password" name="password" required autocomplete="current-password">`)}
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
    <p class="small muted" style="margin-top:16px;text-align:center">New here? <a href="#/signin">Create an account</a> · <a href="#/signin">Forgot password?</a></p>
  </div>`;
  $("#f").addEventListener("submit", e => { e.preventDefault(); toast("Signed in (prototype)"); location.hash = "#/"; });
}

function notFound() {
  document.title = "Not found · Coffee Nerds";
  app.innerHTML = emptyState("Spilled.", "This page doesn't exist, or it was deleted.", `<a class="btn primary" href="#/">Go home</a>`);
}

/* ================= Router ================= */
function route() {
  stopGuide();
  const [path, qs] = (location.hash.slice(1) || "/").split("?");
  const q = new URLSearchParams(qs || "");
  const [a, b, c] = path.split("/").filter(Boolean);
  if (!a) viewHome();
  else if (a === "coffees") b === "new" ? viewCoffeeForm() : b ? (c === "edit" ? viewCoffeeForm(b) : viewCoffee(b)) : viewCoffees(q);
  else if (a === "recipes") b === "new" ? viewRecipeForm(null, q) : b ? (c === "edit" ? viewRecipeForm(b, q) : viewRecipe(b)) : viewRecipes(q);
  else if (a === "brew") viewBrewNew(q);
  else if (a === "guide") viewGuide(b, q);
  else if (a === "history") viewHistory(q);
  else if (a === "signin") viewSignIn();
  else notFound();
  $$("[data-nav]").forEach(l => l.dataset.nav === (a || "") ? l.setAttribute("aria-current", "page") : l.removeAttribute("aria-current"));
  if (!q.get("open")) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ================= Theme + reset ================= */
try { const t = localStorage.getItem("coffee-nerds-theme"); if (t) document.documentElement.dataset.theme = t; } catch { }
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("coffee-nerds-theme", root.dataset.theme); } catch { }
});
$("#reset").addEventListener("click", () => { state = seed(); save(); toast("Demo data reset"); route(); });

route();
</script>
</body>
