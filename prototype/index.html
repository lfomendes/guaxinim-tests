<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Nerds</title>
<meta name="description" content="Clickable design prototype for Coffee Nerds, a personal coffee brewing journal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (design-system/coffee-nerds/MASTER.md) ===== */
:root {
  --font-display: 'Calistoga', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --color-background: #FBF6EE;
  --color-surface: #FFFDF9;
  --color-muted: #F3EADC;
  --color-foreground: #2B1A0E;
  --color-muted-foreground: #6B5443;
  --color-primary: #92400E;
  --color-primary-hover: #7A350B;
  --color-on-primary: #FFFFFF;
  --color-primary-tint: #FBE9D2;
  --color-secondary: #B45309;
  --color-border: #E6D8C3;
  --color-border-strong: #9A8268;
  --color-success: #2F6B3A;
  --color-warning: #8A5A00;
  --color-destructive: #B42318;
  --color-ring: #92400E;
  --shadow-sm: 0 1px 2px rgb(43 26 14 / .06);
  --shadow-md: 0 2px 4px rgb(43 26 14 / .06), 0 8px 16px rgb(43 26 14 / .06);
  --shadow-lg: 0 12px 32px rgb(43 26 14 / .14);

  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px;
  --space-xl: 32px; --space-2xl: 48px; --space-3xl: 64px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 999px;
  --icon-sm: 16px; --icon-md: 20px; --icon-lg: 24px;
  --dur-fast: 150ms; --dur-base: 220ms; --dur-exit: 150ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --nav-h: 64px; --sidebar-w: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-background: #17100B; --color-surface: #221812; --color-muted: #2E2219;
    --color-foreground: #F6ECDF; --color-muted-foreground: #C4B09C;
    --color-primary: #F0A961; --color-primary-hover: #F5BB7E; --color-on-primary: #2B1A0E;
    --color-primary-tint: #3A2716; --color-secondary: #F5C27A;
    --color-border: #3D2E22; --color-border-strong: #8C7259;
    --color-success: #86C995; --color-warning: #E8B04B; --color-destructive: #F2958A; --color-ring: #F0A961;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .3); --shadow-md: 0 2px 6px rgb(0 0 0 / .35); --shadow-lg: 0 12px 32px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-background: #17100B; --color-surface: #221812; --color-muted: #2E2219;
  --color-foreground: #F6ECDF; --color-muted-foreground: #C4B09C;
  --color-primary: #F0A961; --color-primary-hover: #F5BB7E; --color-on-primary: #2B1A0E;
  --color-primary-tint: #3A2716; --color-secondary: #F5C27A;
  --color-border: #3D2E22; --color-border-strong: #8C7259;
  --color-success: #86C995; --color-warning: #E8B04B; --color-destructive: #F2958A; --color-ring: #F0A961;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .3); --shadow-md: 0 2px 6px rgb(0 0 0 / .35); --shadow-lg: 0 12px 32px rgb(0 0 0 / .5);
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh;
  background: var(--color-background); color: var(--color-foreground);
  font: 400 1rem/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font: 400 clamp(1.75rem, 5vw, 2.5rem)/1.15 var(--font-display); }
h2 { font: 400 1.5rem/1.2 var(--font-display); }
h3 { font-size: 1.125rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--color-primary); text-underline-offset: 3px; }
a, button, summary, label[for], .radio-card, select { cursor: pointer; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-ring); outline-offset: 2px; border-radius: 4px; }
h1:focus, h2:focus { outline: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 400; }
.muted { color: var(--color-muted-foreground); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: var(--icon-md); height: var(--icon-md); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { width: var(--icon-sm); height: var(--icon-sm); }
.icon--lg { width: var(--icon-lg); height: var(--icon-lg); }
.icon--filled { fill: currentColor; }
.skip-link { position: absolute; left: 16px; top: -100px; z-index: 200; background: var(--color-primary); color: var(--color-on-primary); padding: 10px 16px; border-radius: var(--radius-sm); font-weight: 600; }
.skip-link:focus { top: 12px; }

/* ===== Layout ===== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 8px 8px 16px; padding-top: max(8px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--color-background) 90%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--color-border);
}
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--color-foreground); font: 400 1.25rem/1 var(--font-display); min-height: 44px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--color-primary); color: var(--color-on-primary); }
main { padding: var(--space-lg) var(--space-md) calc(var(--nav-h) + var(--space-2xl) + env(safe-area-inset-bottom)); }
.main-inner { max-width: 72rem; margin: 0 auto; }
.main-inner.enter { animation: fade var(--dur-base) var(--ease-out); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.bottomnav {
  position: fixed; inset: auto 0 0 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--color-surface); border-top: 1px solid var(--color-border); box-shadow: 0 -2px 12px rgb(43 26 14 / .05);
}
.bottomnav a {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 48px; font-size: .75rem; font-weight: 500; color: var(--color-muted-foreground); text-decoration: none;
  transition: color var(--dur-fast) ease;
}
.bottomnav a:hover { color: var(--color-foreground); }
.bottomnav a[aria-current="page"] { color: var(--color-primary); font-weight: 600; }
.bottomnav a[aria-current="page"]:not(.nav-primary)::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--color-primary); }
.bottomnav .fab { width: 48px; height: 48px; margin-top: -22px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-md); border: 3px solid var(--color-surface); transition: background-color var(--dur-fast) ease; }
.bottomnav a.nav-primary:hover .fab { background: var(--color-primary-hover); }

.sidebar { display: none; }
@media (min-width: 1024px) {
  .topbar, .bottomnav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: var(--space-lg);
    position: fixed; inset: 0 auto 0 0; z-index: 20; width: var(--sidebar-w);
    padding: var(--space-lg) var(--space-md); background: var(--color-surface); border-right: 1px solid var(--color-border);
  }
  .sidebar nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .sidebar nav a {
    position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px;
    border-radius: var(--radius-sm); color: var(--color-foreground); text-decoration: none; font-weight: 500;
    transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .sidebar nav a:hover { background: var(--color-muted); }
  .sidebar nav a[aria-current="page"] { background: var(--color-primary-tint); color: var(--color-primary); font-weight: 600; }
  .sidebar nav a[aria-current="page"]::before { content: ''; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--color-primary); }
  .sidebar .btn-primary { width: 100%; justify-content: center; }
  .sidebar .btn-primary[aria-current="page"] { box-shadow: 0 0 0 3px var(--color-primary-tint); }
  .sidebar-foot { margin-top: auto; display: grid; gap: 4px; font-size: .875rem; }
  .sidebar-foot a { color: var(--color-muted-foreground); min-height: 32px; display: flex; align-items: center; }
  main { margin-left: var(--sidebar-w); padding: var(--space-2xl) var(--space-2xl) var(--space-3xl); }
}
body.focus-mode .topbar, body.focus-mode .bottomnav, body.focus-mode .sidebar { display: none; }
body.focus-mode main { margin-left: 0; padding-bottom: var(--space-2xl); }

/* ===== Page structure ===== */
.page-head { display: grid; gap: var(--space-sm); margin-bottom: var(--space-xl); }
.page-head .lead { font-size: 1.125rem; color: var(--color-muted-foreground); max-width: 40rem; }
.page-head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-md); }
.eyebrow { font: 500 .75rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--color-muted-foreground); }
.back-link { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-weight: 500; text-decoration: none; margin-bottom: var(--space-sm); }
.back-link:hover { text-decoration: underline; }
.section { margin-top: var(--space-2xl); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-md); }
.section-head a { font-weight: 500; font-size: .9375rem; min-height: 44px; display: inline-flex; align-items: center; }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-md); }
.grid { display: grid; gap: var(--space-md); grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.split { display: grid; gap: var(--space-xl); }
@media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: var(--space-sm); }
.readable { max-width: 40rem; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 20px; border-radius: var(--radius-md); border: 1.5px solid transparent;
  font: 600 1rem/1 var(--font-body); text-decoration: none; white-space: nowrap;
  transition: background-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease, color var(--dur-fast) ease, border-color var(--dur-fast) ease;
  touch-action: manipulation;
}
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); }
.btn-secondary { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }
.btn-secondary:hover { background: var(--color-primary-tint); }
.btn-ghost { background: transparent; color: var(--color-foreground); }
.btn-ghost:hover { background: var(--color-muted); }
.btn-danger { background: transparent; color: var(--color-destructive); border-color: currentColor; }
.btn-danger:hover { background: color-mix(in srgb, var(--color-destructive) 10%, transparent); }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: 1.0625rem; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.icon-btn { width: 44px; height: 44px; padding: 0; display: inline-grid; place-items: center; border-radius: var(--radius-full); border: 0; background: transparent; color: var(--color-foreground); transition: background-color var(--dur-fast) ease; }
.icon-btn:hover { background: var(--color-muted); }

/* ===== Cards ===== */
.card {
  display: block; background: var(--color-surface); color: inherit; text-decoration: none;
  border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-lg); box-shadow: var(--shadow-sm);
  transition: box-shadow var(--dur-base) ease, border-color var(--dur-base) ease;
}
a.card:hover { box-shadow: var(--shadow-md); border-color: var(--color-border-strong); }
.card-title { font: 400 1.25rem/1.2 var(--font-display); margin: var(--space-sm) 0 4px; overflow-wrap: anywhere; }
.card-meta { color: var(--color-muted-foreground); font-size: .9375rem; }
.card-foot { margin-top: var(--space-md); padding-top: var(--space-sm); border-top: 1px dashed var(--color-border); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .875rem; color: var(--color-muted-foreground); }
.card--feature { background: var(--color-primary-tint); border-color: transparent; }
.card--tip { display: flex; gap: var(--space-md); align-items: flex-start; }
.card--tip .tip-icon { width: 44px; height: 44px; flex: none; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--color-primary-tint); color: var(--color-primary); }

/* ===== Badges & chips ===== */
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--radius-full); font-size: .8125rem; font-weight: 500; background: var(--color-muted); color: var(--color-foreground); border: 1px solid transparent; }
.badge .num { font-family: var(--font-mono); font-weight: 500; }
.badge--peak { color: var(--color-success); background: color-mix(in srgb, var(--color-success) 12%, var(--color-surface)); }
.badge--resting { color: var(--color-warning); background: color-mix(in srgb, var(--color-warning) 12%, var(--color-surface)); }
.badge--past { color: var(--color-muted-foreground); background: var(--color-muted); }
.badge--builtin { background: var(--color-primary-tint); color: var(--color-primary); }
.badge--outline { background: transparent; border-color: var(--color-border-strong); color: var(--color-muted-foreground); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: var(--space-sm) 0 0; padding: 0; }
.chip { padding: 2px 10px; border-radius: var(--radius-full); border: 1px solid var(--color-border); font-size: .8125rem; color: var(--color-muted-foreground); }
.filter-bar { display: flex; flex-wrap: wrap; gap: var(--space-sm); align-items: flex-end; margin-bottom: var(--space-lg); }
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: var(--radius-full);
  border: 1.5px solid var(--color-border-strong); background: var(--color-surface); font-weight: 500; font-size: .9375rem;
  transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, border-color var(--dur-fast) ease;
}
.filter-chip:hover { border-color: var(--color-primary); }
.filter-chip[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.filter-chip .count { font-family: var(--font-mono); font-size: .8125rem; opacity: .85; }

/* ===== Stats ===== */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-sm); margin: 0; }
.stat { background: var(--color-muted); border-radius: var(--radius-sm); padding: 10px 12px; }
.stat dt { font: 500 .6875rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--color-muted-foreground); }
.stat dd { margin: 4px 0 0; font: 500 1.125rem/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.stat dd small { display: block; font: 400 .75rem/1.3 var(--font-body); color: var(--color-muted-foreground); margin-top: 2px; }
.stat-line { font-family: var(--font-mono); font-size: .875rem; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: var(--space-sm); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0; }
.facts dt { color: var(--color-muted-foreground); font-size: .9375rem; }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

/* ===== Stars ===== */
.stars { display: inline-flex; gap: 1px; color: var(--color-secondary); vertical-align: middle; }
.stars .icon:not(.icon--filled) { color: var(--color-border-strong); }

/* ===== Brew rows ===== */
.brew-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-sm); }
.brew { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.brew > summary, .brew > .brew-sum { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-radius: var(--radius-md); }
.brew > summary::-webkit-details-marker { display: none; }
.brew > summary:hover { background: color-mix(in srgb, var(--color-muted) 55%, transparent); }
.brew-title { font-weight: 600; overflow-wrap: anywhere; }
.brew-sub { color: var(--color-muted-foreground); font-size: .875rem; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.brew-note { grid-column: 1 / -1; font-size: .9375rem; color: var(--color-foreground); font-style: italic; }
.brew-body { padding: 0 16px 16px; display: grid; gap: var(--space-md); border-top: 1px dashed var(--color-border); padding-top: var(--space-md); }
.brew[open] > summary .chev { transform: rotate(90deg); }
.chev { transition: transform var(--dur-fast) ease; color: var(--color-muted-foreground); }
.brew.is-new { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-tint); }
.sensory { display: grid; gap: 6px; }
.sensory-row { display: grid; grid-template-columns: 6.5rem 1fr 2rem; align-items: center; gap: 10px; font-size: .875rem; }
.meter { height: 8px; border-radius: 99px; background: var(--color-muted); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--color-primary); border-radius: 99px; }

/* ===== Forms ===== */
.form { display: grid; gap: var(--space-lg); max-width: 40rem; }
fieldset { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg) var(--space-lg); margin: 0; background: var(--color-surface); min-width: 0; }
legend { font: 400 1.25rem/1.2 var(--font-display); padding: 0 6px; margin-left: -6px; }
.field { display: grid; gap: 6px; }
.field + .field, .field-row + .field, .field + .field-row, .field-row + .field-row { margin-top: var(--space-md); }
.field-row { display: grid; gap: var(--space-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.field label, .label { font-weight: 600; font-size: .9375rem; }
.req { font-weight: 400; color: var(--color-muted-foreground); }
.hint { font-size: .875rem; color: var(--color-muted-foreground); }
.hint.changed { color: var(--color-warning); font-weight: 500; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 14px; font-size: 1rem;
  background: var(--color-surface); color: var(--color-foreground);
  border: 1.5px solid var(--color-border-strong); border-radius: var(--radius-sm);
  transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:hover { border-color: var(--color-foreground); }
.input:focus-visible { border-color: var(--color-primary); outline: 3px solid var(--color-ring); outline-offset: 1px; border-radius: var(--radius-sm); }
.input[aria-invalid="true"] { border-color: var(--color-destructive); }
.input-unit { position: relative; }
.input-unit .input { padding-right: 3rem; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.input-unit .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--color-muted-foreground); font-family: var(--font-mono); pointer-events: none; }
.field-error { color: var(--color-destructive); font-size: .875rem; font-weight: 500; display: flex; gap: 6px; align-items: center; }
.field-error:empty { display: none; }
.error-summary { border: 2px solid var(--color-destructive); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); background: color-mix(in srgb, var(--color-destructive) 8%, var(--color-surface)); }
.error-summary h2 { font: 600 1.0625rem/1.3 var(--font-body); color: var(--color-destructive); display: flex; gap: 8px; align-items: center; }
.error-summary ul { margin: 8px 0 0; padding-left: 1.25rem; }
.error-summary a { color: var(--color-destructive); font-weight: 500; }
details.more { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
details.more > summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 0 var(--space-lg); font-weight: 600; list-style: none; border-radius: var(--radius-md); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary:hover { background: var(--color-muted); }
details.more[open] > summary .chev { transform: rotate(90deg); }
details.more > .more-body { padding: 0 var(--space-lg) var(--space-lg); display: grid; gap: var(--space-md); }
.segmented { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
.segmented label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--color-border-strong); border-radius: var(--radius-sm); font-weight: 500; }
.segmented label:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-tint); color: var(--color-primary); }
.segmented input { accent-color: var(--color-primary); width: 18px; height: 18px; margin: 0; }

/* Radio cards (Log brew steps 1–2) */
.radio-grid { display: grid; gap: var(--space-sm); grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); margin-top: var(--space-sm); }
.radio-card { position: relative; display: grid; gap: 4px; padding: 14px 16px 14px 48px; border: 1.5px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color var(--dur-fast) ease, background-color var(--dur-fast) ease; }
.radio-card:hover { border-color: var(--color-primary); }
.radio-card input { position: absolute; left: 16px; top: 17px; width: 20px; height: 20px; margin: 0; accent-color: var(--color-primary); }
.radio-card:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-tint); box-shadow: 0 0 0 1px var(--color-primary); }
.radio-card:has(input:focus-visible) { outline: 3px solid var(--color-ring); outline-offset: 2px; }
.radio-card .rc-title { font-weight: 600; overflow-wrap: anywhere; }
.radio-card .rc-sub { font-size: .875rem; color: var(--color-muted-foreground); }

/* Star rating input */
.rating-input { display: flex; gap: 4px; flex-wrap: wrap; }
.rating-input input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.rating-input label { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--color-border-strong); transition: color var(--dur-fast) ease, background-color var(--dur-fast) ease; }
.rating-input label:hover { background: var(--color-muted); }
.rating-input label .icon { width: 30px; height: 30px; }
.rating-input label.on { color: var(--color-secondary); }
.rating-input label.on .icon { fill: currentColor; }
.rating-input input:focus-visible + label { outline: 3px solid var(--color-ring); outline-offset: 1px; }
.rating-value { font-family: var(--font-mono); color: var(--color-muted-foreground); margin-left: 8px; align-self: center; }

/* Range sliders */
.slider { display: grid; gap: 4px; }
.slider-head { display: flex; justify-content: space-between; align-items: baseline; }
.slider-head output { font-family: var(--font-mono); font-weight: 500; }
.slider input[type="range"] { width: 100%; height: 44px; accent-color: var(--color-primary); margin: 0; }
.slider-ends { display: flex; justify-content: space-between; font-size: .75rem; color: var(--color-muted-foreground); margin-top: -6px; }

/* Step indicator */
.steps { list-style: none; display: flex; gap: var(--space-sm); padding: 0; margin: 0 0 var(--space-lg); counter-reset: step; }
.steps li { flex: 1; display: grid; gap: 6px; font-size: .8125rem; font-weight: 500; color: var(--color-muted-foreground); }
.steps li::before { content: ''; height: 4px; border-radius: 4px; background: var(--color-border); }
.steps li.done::before, .steps li[aria-current="step"]::before { background: var(--color-primary); }
.steps li[aria-current="step"] { color: var(--color-foreground); font-weight: 600; }
.steps .n { font-family: var(--font-mono); }
.ratio-out { display: inline-flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--color-primary-tint); color: var(--color-primary); margin-top: var(--space-md); }
.ratio-out strong { font: 500 1.25rem/1 var(--font-mono); }
.action-bar {
  position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 10;
  display: flex; justify-content: space-between; gap: var(--space-sm); padding: 12px var(--space-md);
  margin: var(--space-lg) calc(-1 * var(--space-md)) 0; background: var(--color-surface);
  border-top: 1px solid var(--color-border); box-shadow: 0 -4px 12px rgb(43 26 14 / .06);
}
@media (min-width: 1024px) { .action-bar { bottom: 0; margin: var(--space-lg) 0 0; border: 1px solid var(--color-border); border-radius: var(--radius-md); } }

/* ===== Empty state ===== */
.empty { text-align: center; padding: var(--space-2xl) var(--space-lg); border: 1.5px dashed var(--color-border-strong); border-radius: var(--radius-md); display: grid; justify-items: center; gap: var(--space-sm); }
.empty .empty-icon { width: 56px; height: 56px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--color-primary-tint); color: var(--color-primary); }

/* ===== Brew guide (pages/brew-guide.md) ===== */
.guide-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-lg); }
.guide-bar .title { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.guide { display: grid; gap: var(--space-xl); max-width: 64rem; margin: 0 auto; }
@media (min-width: 900px) { .guide { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.guide-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-lg); display: grid; gap: var(--space-lg); justify-items: center; box-shadow: var(--shadow-sm); }
.timer { position: relative; width: min(78vw, 300px); aspect-ratio: 1; display: grid; place-items: center; }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer .track { stroke: var(--color-muted); }
.timer .prog { stroke: var(--color-primary); transition: stroke-dashoffset 1s linear; }
.timer-read { text-align: center; }
.timer-time { font: 500 clamp(3rem, 14vw, 4.5rem)/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.timer-total { font-family: var(--font-mono); color: var(--color-muted-foreground); margin-top: 6px; }
.now-card { width: 100%; padding: var(--space-md) var(--space-lg); border-radius: var(--radius-md); background: var(--color-primary-tint); }
.now-card .label { font: 500 .75rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--color-primary); }
.now-card .text { font-size: 1.25rem; font-weight: 500; margin-top: 8px; line-height: 1.4; }
.next-text { width: 100%; font-size: .9375rem; color: var(--color-muted-foreground); }
.guide-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-sm); width: 100%; }
.guide-controls .btn-lg { min-width: 160px; }
.step-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.step-list li { display: grid; grid-template-columns: 4.5rem 1fr; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid transparent; }
.step-list li .at { font-family: var(--font-mono); color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.step-list li.past { color: var(--color-muted-foreground); }
.step-list li.current { background: var(--color-primary-tint); border-color: var(--color-primary); }
.step-list li.current .at { color: var(--color-primary); font-weight: 500; }
.now-tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--color-primary); color: var(--color-on-primary); font: 600 .6875rem/1.6 var(--font-body); text-transform: uppercase; letter-spacing: .06em; vertical-align: 2px; }
.target { font-family: var(--font-mono); font-weight: 500; white-space: nowrap; }
.kbd-hint { font-size: .8125rem; color: var(--color-muted-foreground); text-align: center; }
kbd { font-family: var(--font-mono); font-size: .75rem; padding: 1px 6px; border: 1px solid var(--color-border-strong); border-bottom-width: 2px; border-radius: 4px; }

/* ===== Recipe steps table ===== */
.steps-table { width: 100%; border-collapse: collapse; }
.steps-table th, .steps-table td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
.steps-table th { font: 500 .75rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--color-muted-foreground); }
.steps-table td:first-child { font-family: var(--font-mono); white-space: nowrap; color: var(--color-muted-foreground); width: 6rem; }

/* ===== Toast ===== */
.toast-region { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 40; width: min(calc(100% - 32px), 28rem); display: grid; gap: 8px; pointer-events: none; }
@media (min-width: 1024px) { .toast-region { bottom: 24px; left: calc(50% + var(--sidebar-w) / 2); } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: var(--radius-md); background: var(--color-foreground); color: var(--color-background); box-shadow: var(--shadow-lg); animation: toast-in var(--dur-base) var(--ease-out); }
.toast.out { animation: toast-out var(--dur-exit) ease-in forwards; }
.toast p { flex: 1; font-weight: 500; }
.toast button { background: transparent; border: 0; color: var(--color-primary-tint); font-weight: 700; min-height: 40px; padding: 0 10px; border-radius: var(--radius-sm); text-decoration: underline; text-underline-offset: 3px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ===== Sign in ===== */
.auth { min-height: calc(100dvh - 96px); display: grid; place-items: center; }
.auth .card { width: min(100%, 26rem); padding: var(--space-xl); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--color-muted-foreground); font-size: .875rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }

/* ===== Style guide ===== */
.swatches { display: grid; gap: var(--space-sm); grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.swatch { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
.swatch-color { height: 64px; border-bottom: 1px solid var(--color-border); }
.swatch-body { padding: 8px 10px; font-size: .8125rem; }
.swatch-body code { font-family: var(--font-mono); color: var(--color-muted-foreground); font-size: .75rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
  .timer .prog { transition: none; }
}
</style>

/* ===== Helpers ===== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const byId = (list, id) => list.find(x => x.id === id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (name, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const parseMmss = v => { const m = /^(\d{1,2}):([0-5]\d)$/.exec(String(v).trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const ratio = (dose, water) => { if (!dose || !water) return '—'; const r = water / dose; return `1:${Number.isInteger(r) ? r : r.toFixed(1)}`; };
const fmtDate = (iso, opts = { day: 'numeric', month: 'short' }) => new Date(iso.length === 10 ? iso + 'T12:00' : iso).toLocaleDateString('en-US', opts);
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const daysOff = c => c.roastDate ? Math.floor((TODAY - new Date(c.roastDate + 'T00:00')) / 86400000) : null;
const methodOf = r => byId(METHODS, r.method);
const brewsFor = (key, id) => brews.filter(b => b[key] === id);
const bestBrew = coffeeId => brewsFor('coffee', coffeeId).sort((a, b) => b.rating - a.rating || b.date.localeCompare(a.date))[0];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function stars(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += ic('star', `icon--sm ${i <= n ? 'icon--filled' : ''}`);
  return `<span class="stars" role="img" aria-label="${n} of 5 stars">${s}</span>`;
}
function freshBadge(c) {
  if (c.status === 'finished') return `<span class="badge badge--outline">${ic('archive', 'icon--sm')}Finished</span>`;
  const d = daysOff(c);
  if (d === null) return '';
  const [cls, icon, label] = d < 7 ? ['resting', 'hourglass', 'Resting'] : d <= 30 ? ['peak', 'flame', 'Peak'] : ['past', 'trend-down', 'Past peak'];
  return `<span class="badge badge--${cls}">${ic(icon, 'icon--sm')}<span><span class="num">${d}</span> ${d === 1 ? 'day' : 'days'} off roast · ${label}</span></span>`;
}
function tempLabel(r) { return `${r.temp} °C`; }
function statLine(r) {
  return `<p class="stat-line"><span>${r.dose} g</span><span>${r.water} g</span><span>${ratio(r.dose, r.water)}</span><span>${tempLabel(r)}</span><span>${mmss(r.time)}</span></p>`;
}

/* ===== Cards ===== */
function coffeeCard(c) {
  const n = brewsFor('coffee', c.id).length, best = bestBrew(c.id);
  return `<a class="card" href="#/coffees/${c.id}">
    <div class="badges">${freshBadge(c)}</div>
    <h3 class="card-title">${esc(c.name)}</h3>

    ${c.notes?.length ? `<ul class="chips" aria-label="Roaster's tasting notes">${c.notes.map(t => `<li class="chip">${esc(t)}</li>`).join('')}</ul>` : ''}
    <div class="card-foot"><span>${plural(n, 'brew')}</span>${best ? `<span style="display:inline-flex;gap:6px;align-items:center">Best ${stars(best.rating)}</span>` : '<span>Not brewed yet</span>'}</div>
  </a>`;
}
function recipeCard(r) {
  return `<a class="card" href="#/recipes/${r.id}">
    <div class="badges"><span class="badge badge--outline">${esc(methodOf(r).name)}</span>${r.builtIn ? '<span class="badge badge--builtin">Built-in</span>' : '<span class="badge">Mine</span>'}</div>

}

    <summary>

      ${sens.length ? `<div class="sensory" aria-label="Sensory scores">${sens.map(([k, v]) => `<div class="sensory-row"><span style="text-transform:capitalize">${k}</span><span class="meter" aria-hidden="true"><span style="width:${v * 20}%"></span></span><span class="mono">${v}/5</span></div>`).join('')}</div>` : ''}
      ${b.next ? `<p><strong>Next time:</strong> ${esc(b.next)}</p>` : ''}
      <div class="actions" style="margin-top:0"><a class="btn btn-secondary" href="#/log?coffee=${c.id}&recipe=${r.id}">${ic('reset')}Brew this again</a></div>

}
function emptyState(icon, title, text, action) {
  return `<div class="empty"><span class="empty-icon">${ic(icon, 'icon--lg')}</span><h3>${title}</h3><p class="muted readable">${text}</p>${action || ''}</div>`;
}

/* ===== Toast ===== */
function toast(msg, action) {
  const region = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<p>${esc(msg)}</p>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 160); };
  if (action) $('button', el).addEventListener('click', () => { action.fn(); close(); });
  region.appendChild(el);
  setTimeout(close, action ? 8000 : 4000);
}

function Coffees(q) {
  return { title: 'My coffees', nav: 'coffees', html: `
    <header class="page-head">
      <div class="page-head-row"><div class="stack"><p class="eyebrow">Your bags</p><h1 tabindex="-1">My coffees</h1></div>
      <a class="btn btn-primary" href="#/coffees/new">${ic('plus')}Add coffee</a></div>
    </header>
    <div class="filter-bar">
      <div role="group" aria-label="Filter by status" class="segmented" id="status-filter"></div>
      <div class="field" style="flex:1;min-width:min(100%,240px);margin:0">
        <label for="coffee-search" class="visually-hidden">Search coffees</label>
        <div class="input-unit"><input id="coffee-search" class="input" type="search" placeholder="Search name, roaster, origin…" style="font-family:var(--font-body)" value="${esc(q.get('q') || '')}"><span class="unit">${ic('search', 'icon--sm')}</span></div>
      </div>
    </div>
    <p class="visually-hidden" id="coffee-count" aria-live="polite"></p>
    <div id="coffee-results"></div>`,
    mount(root) {
      let status = q.get('status') || 'active', term = q.get('q') || '';
      const draw = () => {
        const counts = { active: 0, finished: 0, all: coffees.length };
        coffees.forEach(c => counts[c.status]++);
        $('#status-filter', root).innerHTML = [['active', 'Active'], ['finished', 'Finished'], ['all', 'All']].map(([k, l]) =>
          `<button type="button" class="filter-chip" data-status="${k}" aria-pressed="${k === status}">${l} <span class="count">${counts[k]}</span></button>`).join('');
        const t = term.trim().toLowerCase();
        const list = coffees.filter(c => (status === 'all' || c.status === status) &&
          (!t || [c.name, c.roaster, c.country, c.region, c.process].join(' ').toLowerCase().includes(t)));
        $('#coffee-count', root).textContent = `${plural(list.length, 'coffee')} shown`;
        $('#coffee-results', root).innerHTML = list.length ? `<div class="grid">${list.map(coffeeCard).join('')}</div>` :
          (coffees.length ? emptyState('search', 'No coffees match', 'Try another search term or status.', `<button class="btn btn-secondary" type="button" id="clear-coffee">Clear filters</button>`)
            : emptyState('package', 'No coffees yet', 'Add the bag you are drinking now — roaster, origin and roast date are enough to start.', `<a class="btn btn-primary" href="#/coffees/new">Add your first coffee</a>`));
        const p = new URLSearchParams(); if (status !== 'active') p.set('status', status); if (term) p.set('q', term);
        history.replaceState(null, '', '#/coffees' + (p.toString() ? '?' + p : ''));
      };
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-status]'); if (b) { status = b.dataset.status; draw(); $(`[data-status="${status}"]`, root).focus(); }
        if (e.target.closest('#clear-coffee')) { status = 'all'; term = ''; $('#coffee-search', root).value = ''; draw(); }
      });
      $('#coffee-search', root).addEventListener('input', e => { term = e.target.value; clearTimeout(this.t); this.t = setTimeout(draw, 150); });
      draw();
    } };
}

function CoffeeForm(q) {

  const ret = q.get('return');
  const sel = (name, opts, cur) => `<select class="input" id="f-${name}" name="${name}"><option value="">—</option>${opts.map(o => `<option ${o === cur ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  const field = (name, label, { req = false, type = 'text', hint = '', unit = '', val = v[name], attrs = '' } = {}) => `
    <div class="field">
      <label for="f-${name}">${label}${req ? ' <span class="req">(required)</span>' : ''}</label>
      ${unit ? `<div class="input-unit">` : ''}<input class="input" id="f-${name}" name="${name}" type="${type}" value="${esc(val ?? '')}" ${req ? 'aria-required="true"' : ''} aria-describedby="${hint ? `h-${name} ` : ''}e-${name}" ${attrs}>${unit ? `<span class="unit">${unit}</span></div>` : ''}
      ${hint ? `<p class="hint" id="h-${name}">${hint}</p>` : ''}

  return { title: editing ? 'Edit coffee' : 'Add coffee', nav: 'coffees', html: `
    <a class="back-link" href="${editing ? `#/coffees/${editing.id}` : ret === 'log' ? '#/log' : '#/coffees'}">${ic('left', 'icon--sm')}${editing ? 'Back to coffee' : ret === 'log' ? 'Back to Log a brew' : 'My coffees'}</a>
    <header class="page-head"><h1 tabindex="-1">${editing ? 'Edit coffee' : 'Add a coffee'}</h1>
      <p class="lead">Only the basics are required. Copy the rest from the bag whenever you like.</p></header>
    <form class="form" id="coffee-form" novalidate>
      <div id="error-slot"></div>
      <fieldset><legend>The basics</legend>
        ${field('name', 'Coffee name', { req: true, hint: 'As printed on the bag, e.g. “Fazenda Santa Inês — Yellow Bourbon”.' })}
        <div class="field-row">${field('roaster', 'Roaster', { req: true, attrs: 'autocomplete="organization"' })}${field('country', 'Country of origin', { req: true, attrs: 'autocomplete="country-name"' })}</div>
        <div class="field"><span class="label" id="l-form">Form <span class="req">(required)</span></span>
          <div class="segmented" role="radiogroup" aria-labelledby="l-form">${['Whole bean', 'Pre-ground'].map(o => `<label><input type="radio" name="form" value="${o}" ${v.form === o ? 'checked' : ''}>${o}</label>`).join('')}</div></div>
      </fieldset>
      <fieldset><legend>Roast</legend>
        <div class="field-row">
          <div class="field"><label for="f-roastLevel">Roast level</label>${sel('roastLevel', ['Light', 'Medium-light', 'Medium', 'Medium-dark', 'Dark'], v.roastLevel)}</div>
          ${field('roastDate', 'Roast date', { type: 'date', hint: 'Used to show days off roast.' })}
        </div>
      </fieldset>
      <details class="more" ${editing ? 'open' : ''}><summary>More details: origin, bag &amp; notes ${ic('right', 'chev')}</summary>
        <div class="more-body">
          <div class="field-row">${field('region', 'Region')}${field('farm', 'Farm / producer')}</div>
          <div class="field-row">${field('variety', 'Variety', { hint: 'Separate several with commas.' })}
            <div class="field"><label for="f-process">Process</label>${sel('process', ['Washed', 'Natural', 'Honey', 'Anaerobic', 'Other'], v.process)}</div></div>
          <div class="field-row">${field('altitude', 'Altitude', { unit: 'm', attrs: 'inputmode="numeric"' })}${field('sca', 'SCA score', { attrs: 'inputmode="decimal"' })}</div>
          ${field('notes', 'Roaster’s tasting notes', { val: (v.notes || []).join(', '), hint: 'Comma separated, e.g. chocolate, caramel, yellow fruits.' })}
          <div class="field-row">${field('weight', 'Bag weight', { unit: 'g', attrs: 'inputmode="numeric"' })}${field('price', 'Price', { attrs: 'inputmode="decimal"' })}${field('purchased', 'Purchase date', { type: 'date' })}</div>
          <div class="field"><label for="f-personal">Personal notes</label><textarea class="input" id="f-personal" name="personal">${esc(v.personal || '')}</textarea></div>
        </div>
      </details>
      <div class="actions"><button class="btn btn-primary" type="submit">${ic('check')}${editing ? 'Save changes' : 'Save coffee'}</button><a class="btn btn-ghost" href="${editing ? `#/coffees/${editing.id}` : '#/coffees'}">Cancel</a></div>
    </form>`,
    mount(root) {
      const form = $('#coffee-form', root);
      const rules = { name: 'Enter the coffee name.', roaster: 'Enter the roaster.', country: 'Enter the country of origin.' };
      const check = name => { const el = form.elements[name], bad = !el.value.trim(); el.setAttribute('aria-invalid', bad); $(`#e-${name}`, root).innerHTML = bad ? ic('alert', 'icon--sm') + rules[name] : ''; return !bad; };
      // Errors appear on blur/submit and clear while typing the fix (clearing on blur would shift the layout under the pointer).
      Object.keys(rules).forEach(n => form.elements[n].addEventListener('input', e => { if (e.target.getAttribute('aria-invalid') === 'true' && e.target.value.trim()) check(n); }));
      form.addEventListener('submit', e => {
        e.preventDefault();
        const bad = Object.keys(rules).filter(n => !check(n));
        if (bad.length) {
          $('#error-slot', root).innerHTML = `<div class="error-summary" tabindex="-1" role="alert"><h2>${ic('alert')}There ${bad.length === 1 ? 'is a problem' : `are ${bad.length} problems`}</h2><ul>${bad.map(n => `<li><a href="#f-${n}" data-focus="f-${n}">${rules[n]}</a></li>`).join('')}</ul></div>`;
          $('.error-summary', root).focus();
          return;
        }
        const f = Object.fromEntries(new FormData(form));
        const data = { ...f, notes: f.notes ? f.notes.split(',').map(s => s.trim()).filter(Boolean) : [], altitude: f.altitude ? +f.altitude : undefined, sca: f.sca ? +f.sca : undefined, weight: f.weight ? +f.weight : undefined };
        let target;
        if (editing) { Object.assign(editing, data); target = editing; }
        else { target = { id: 'c' + Date.now(), status: 'active', ...data }; coffees.unshift(target); }
        toast(editing ? 'Changes saved.' : `${target.name} added to your coffees.`);
        location.hash = ret === 'log' ? `#/log?coffee=${target.id}` : `#/coffees/${target.id}`;
      });
      root.addEventListener('click', e => { const a = e.target.closest('[data-focus]'); if (a) { e.preventDefault(); const el = document.getElementById(a.dataset.focus); el.closest('details')?.setAttribute('open', ''); el.focus(); } });
    } };
}

        const list = recipes.filter(r => m === 'all' || r.method === m);

function Guide(id) {
  const r = byId(recipes, id);
  if (!r) return NotFound();
  const C = 2 * Math.PI * 140;
  return { title: `Brew guide · ${r.name}`, nav: null, focus: true, html: `
    <div class="guide-bar">
      <a class="btn btn-ghost" href="#/recipes/${r.id}">${ic('x')}Exit guide</a>
      <span class="title">${esc(methodOf(r).name)} · ${esc(r.name)}</span>
    </div>
    <h1 class="visually-hidden" tabindex="-1">Brew guide: ${esc(r.name)}</h1>
    <div class="guide">
      <section class="guide-panel" aria-label="Timer">
        <div class="timer">
          <svg viewBox="0 0 300 300" aria-hidden="true"><circle class="track" cx="150" cy="150" r="140" fill="none" stroke-width="10"/><circle class="prog" id="ring" cx="150" cy="150" r="140" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
          <div class="timer-read"><div class="timer-time" id="clock" role="timer" aria-label="Elapsed time">0:00</div><div class="timer-total">of ${mmss(r.time)}</div></div>
        </div>
        <div class="now-card"><p class="label" id="now-label">Now</p><p class="text" id="now-text"></p></div>
        <p class="next-text" id="next-text"></p>
        <div class="guide-controls">
          <button class="btn btn-primary btn-lg" type="button" id="toggle">${ic('play')}Start</button>
          <button class="btn btn-secondary btn-lg" type="button" id="reset" style="min-width:auto">${ic('reset')}Reset</button>
        </div>
        <div class="guide-controls">
          <button class="btn btn-ghost" type="button" id="prev">${ic('left')}Previous step</button>
          <button class="btn btn-ghost" type="button" id="next">Next step${ic('right')}</button>
        </div>
        <p class="kbd-hint"><kbd>Space</kbd> start/pause · <kbd>←</kbd> <kbd>→</kbd> steps</p>
        <div id="done-slot" style="width:100%"></div>
      </section>
      <section aria-labelledby="h-all">
        <h2 id="h-all" style="margin-bottom:var(--space-md)">All steps</h2>
        <div class="stats" style="margin-bottom:var(--space-md)">
          <div class="stat"><dt>Dose</dt><dd>${r.dose} g</dd></div><div class="stat"><dt>Water</dt><dd>${r.water} g</dd></div>
          <div class="stat"><dt>Temp</dt><dd>${tempLabel(r)}</dd></div><div class="stat"><dt>Grind</dt><dd style="font-family:var(--font-body);font-size:1rem">${esc(r.grind)}</dd></div>
        </div>
        <ol class="step-list" id="step-list"></ol>
      </section>
    </div>
    <p class="visually-hidden" aria-live="polite" id="step-announce"></p>`,
    mount(root) {
      let elapsed = 0, running = false, timer = null, idx = 0, wake = null, startedAt = 0, base = 0;
      const steps = r.steps;
      const stepText = s => `${esc(s.text)}${s.target ? ` <span class="target">Pour to ${s.target} g</span>` : ''}`;
      const draw = (announce) => {
        $('#clock', root).textContent = mmss(elapsed);
        $('#ring', root).setAttribute('stroke-dashoffset', C * (1 - Math.min(elapsed / r.time, 1)));
        const s = steps[idx], n = steps[idx + 1];
        $('#now-label', root).textContent = `Step ${idx + 1} of ${steps.length} · ${s.at}`;
        $('#now-text', root).innerHTML = stepText(s);
        $('#next-text', root).innerHTML = n ? `<strong>Next at ${n.at}:</strong> ${esc(n.text)}` : '';
        $('#step-list', root).innerHTML = steps.map((st, i) => `<li class="${i < idx ? 'past' : i === idx ? 'current' : ''}" ${i === idx ? 'aria-current="step"' : ''}><span class="at">${st.at}</span><span>${stepText(st)}${i === idx ? '<span class="now-tag">Now</span>' : ''}</span></li>`).join('');
        $('#toggle', root).innerHTML = running ? `${ic('pause')}Pause` : `${ic('play')}${elapsed ? 'Resume' : 'Start'}`;
        $('#prev', root).disabled = idx === 0; $('#next', root).disabled = idx === steps.length - 1;
        if (announce) $('#step-announce', root).textContent = `Step ${idx + 1} of ${steps.length} at ${s.at}: ${s.text}${s.target ? ` Pour to ${s.target} grams.` : ''}`;
        const done = elapsed >= r.time;
        $('#done-slot', root).innerHTML = done ? `<div class="card card--feature" style="text-align:center"><h3>Done — how did it taste?</h3><p class="muted" style="margin:6px 0 var(--space-md)">Brewed in <span class="mono">${mmss(elapsed)}</span>.</p><a class="btn btn-primary" href="#/log?recipe=${r.id}&time=${mmss(elapsed)}">${ic('star')}Log this brew</a></div>` : '';
      };
      const autoStep = () => { let i = idx; while (steps[i + 1] && steps[i + 1].t !== null && steps[i + 1].t <= elapsed) i++; if (i !== idx) { idx = i; return true; } return false; };
      const tick = () => { elapsed = base + Math.floor((Date.now() - startedAt) / 1000); const changed = autoStep(); draw(changed); };
      const start = async () => {
        running = true; startedAt = Date.now(); base = elapsed;
        if (steps[idx].t === null) { idx++; }
        timer = setInterval(tick, 250); draw(true);
        try { wake = await navigator.wakeLock?.request('screen'); } catch (_) { /* not supported */ }
      };
      const pause = () => { running = false; clearInterval(timer); tick(); running = false; draw(); wake?.release?.(); wake = null; };
      $('#toggle', root).addEventListener('click', () => running ? pause() : start());
      $('#reset', root).addEventListener('click', () => { clearInterval(timer); running = false; elapsed = 0; base = 0; idx = 0; draw(true); wake?.release?.(); });
      $('#prev', root).addEventListener('click', () => { if (idx > 0) { idx--; draw(true); } });
      $('#next', root).addEventListener('click', () => { if (idx < steps.length - 1) { idx++; draw(true); } });
      const onKey = e => {
        if (e.target.closest('input, textarea, select')) return;
        if (e.code === 'Space' && !e.target.closest('button, a')) { e.preventDefault(); running ? pause() : start(); }
        if (e.key === 'ArrowRight') $('#next', root).click();
        if (e.key === 'ArrowLeft') $('#prev', root).click();
      };
      document.addEventListener('keydown', onKey);
      draw();
      return () => { clearInterval(timer); document.removeEventListener('keydown', onKey); wake?.release?.(); };
    } };
}

function LogBrew(q) {
  const st = { step: 1, coffee: q.get('coffee') || '', recipe: q.get('recipe') || '', method: 'all', rating: 0, sensory: { acidity: 3, sweetness: 3, body: 3, bitterness: 3 }, touchedSensory: false, dirty: false };
  if (st.coffee && !byId(coffees, st.coffee)) st.coffee = '';
  if (st.recipe && !byId(recipes, st.recipe)) st.recipe = '';
  const preTime = q.get('time');
  const applyRecipe = () => { const r = byId(recipes, st.recipe); if (r) { st.dose = r.dose; st.water = r.water; st.temp = r.temp; st.time = preTime || ''; st.method = r.method; } };
  applyRecipe();
  st.step = !st.coffee ? 1 : !st.recipe ? 2 : 3;
  const lastFor = cid => brewsFor('coffee', cid).sort((a, b) => b.date.localeCompare(a.date))[0];
  const LABELS = ['Coffee', 'Recipe', 'Brew & taste'];

  const stepCoffee = () => {
    const active = coffees.filter(c => c.status === 'active');
    return `<fieldset><legend>Which coffee?</legend>
      <p class="hint" id="e-coffee-h">Only open bags are shown.</p>
      <div class="radio-grid">${active.map(c => `<label class="radio-card"><input type="radio" name="coffee" value="${c.id}" ${st.coffee === c.id ? 'checked' : ''} aria-describedby="e-coffee"><span class="rc-title">${esc(c.name)}</span><span class="rc-sub">${esc(c.roaster)} · ${daysOff(c)} days off roast</span></label>`).join('')}</div>
      <p class="field-error" id="e-coffee" style="margin-top:8px"></p>
      <p style="margin-top:var(--space-md)"><a href="#/coffees/new?return=log">${ic('plus', 'icon--sm')} Add a new coffee</a></p>
    </fieldset>`;
  };
  const stepRecipe = () => {
    const last = st.coffee && lastFor(st.coffee);
    const list = recipes.filter(r => st.method === 'all' || r.method === st.method);
    return `<fieldset><legend>Which recipe?</legend>
      <div class="filter-bar" role="group" aria-label="Filter by method" style="margin:8px 0 0">${[['all', 'All'], ...METHODS.map(m => [m.id, m.name])].map(([k, l]) => `<button type="button" class="filter-chip" data-m="${k}" aria-pressed="${st.method === k}">${l}</button>`).join('')}</div>
      <div class="radio-grid">${list.map(r => `<label class="radio-card"><input type="radio" name="recipe" value="${r.id}" ${st.recipe === r.id ? 'checked' : ''} aria-describedby="e-recipe"><span class="rc-title">${esc(r.name)}</span><span class="rc-sub">${esc(methodOf(r).name)} · ${esc(r.author || 'My recipe')}${last && last.recipe === r.id ? ' · <strong>Last used</strong>' : ''}</span>${statLine(r)}</label>`).join('')}</div>

  };
  const num = (name, label, unit, orig) => `<div class="field"><label for="f-${name}">${label}</label><div class="input-unit"><input class="input" id="f-${name}" name="${name}" inputmode="decimal" value="${esc(st[name] ?? '')}" aria-describedby="h-${name}"><span class="unit">${unit}</span></div><p class="hint" id="h-${name}" data-orig="${orig}" data-unit="${unit}">${st[name] != orig ? `Changed from ${orig} ${unit}` : 'From the recipe'}</p></div>`;

    const c = byId(coffees, st.coffee), r = byId(recipes, st.recipe);

      <fieldset><legend>What you actually did</legend>

        <div class="field-row" style="margin-top:var(--space-md)">${num('dose', 'Dose', 'g', r.dose)}${num('water', 'Water', 'g', r.water)}${num('temp', 'Temperature', '°C', r.temp)}</div>
        <div class="ratio-out"><span>Ratio</span><strong id="ratio" aria-live="polite">${ratio(st.dose, st.water)}</strong><span class="muted">recipe ${ratio(r.dose, r.water)}</span></div>
        <div class="field-row" style="margin-top:var(--space-md)">
          <div class="field"><label for="f-grinder">Grinder &amp; setting</label><input class="input" id="f-grinder" name="grinder" value="${esc(st.grinder || lastFor(st.coffee)?.grinder || '')}" aria-describedby="h-grinder"><p class="hint" id="h-grinder">e.g. Comandante — 24 clicks. Recipe says: ${esc(r.grind.toLowerCase())}.</p></div>
          <div class="field"><label for="f-time">Total time</label><input class="input mono" id="f-time" name="time" inputmode="numeric" placeholder="3:30" value="${esc(st.time || '')}" aria-describedby="h-time e-time"><p class="hint" id="h-time">Minutes:seconds. Recipe: ${mmss(r.time)}.</p><p class="field-error" id="e-time"></p></div>
        </div>
      </fieldset>
      <fieldset><legend>How did it taste?</legend>
        <div class="field"><span class="label" id="l-rating">Rating <span class="req">(required)</span></span>
          <div class="rating-input" role="radiogroup" aria-labelledby="l-rating" aria-describedby="e-rating">
            ${[1, 2, 3, 4, 5].map(i => `<input type="radio" name="rating" id="rate-${i}" value="${i}" ${st.rating === i ? 'checked' : ''}><label for="rate-${i}" class="${i <= st.rating ? 'on' : ''}">${ic('star')}<span class="visually-hidden">${i} star${i > 1 ? 's' : ''}</span></label>`).join('')}
            <span class="rating-value" id="rating-value" aria-hidden="true">${st.rating ? st.rating + ' / 5' : 'Not rated'}</span>
          </div>
          <p class="field-error" id="e-rating"></p>
        </div>
        <div class="field"><label for="f-notes">Tasting notes</label><textarea class="input" id="f-notes" name="notes" placeholder="Sweet, a bit sour at the end…">${esc(st.notes || '')}</textarea></div>
      </fieldset>
      <details class="more"><summary>Sensory sliders &amp; next time ${ic('right', 'chev')}</summary>
        <div class="more-body">
          ${Object.entries(st.sensory).map(([k, v]) => `<div class="slider"><div class="slider-head"><label for="s-${k}" style="font-weight:600;text-transform:capitalize">${k}</label><output for="s-${k}" id="o-${k}">${v} / 5</output></div><input type="range" id="s-${k}" name="s-${k}" min="1" max="5" step="1" value="${v}" aria-valuetext="${v} out of 5"><div class="slider-ends" aria-hidden="true"><span>Low</span><span>High</span></div></div>`).join('')}
          <div class="field"><label for="f-next">What to change next time</label><textarea class="input" id="f-next" name="next" placeholder="Grind 2 clicks finer">${esc(st.next || '')}</textarea></div>
        </div>
      </details>`;
  };

  return { title: 'Log a brew', nav: 'log', html: `
    <header class="page-head readable"><p class="eyebrow">New entry</p><h1 tabindex="-1">Log a brew</h1></header>
    <form class="form" id="log-form" novalidate>
      <ol class="steps" id="steps"></ol>
      <div id="log-errors"></div>
      <div id="log-step"></div>
      <div class="action-bar"><button class="btn btn-ghost" type="button" id="back">${ic('left')}Back</button><button class="btn btn-primary" type="submit" id="fwd"></button></div>
    </form>`,
    mount(root) {
      const form = $('#log-form', root);
      const save = () => {
        const f = form.elements;
        ['dose', 'water', 'temp', 'grinder', 'time', 'notes', 'next'].forEach(k => { if (f[k]) st[k] = f[k].value; });
        Object.keys(st.sensory).forEach(k => { if (f['s-' + k]) st.sensory[k] = +f['s-' + k].value; });
      };
      const draw = (focusHeading) => {
        $('#steps', root).innerHTML = LABELS.map((l, i) => `<li class="${i + 1 < st.step ? 'done' : ''}" ${i + 1 === st.step ? 'aria-current="step"' : ''}><span><span class="n">${i + 1}</span> ${l}${i + 1 < st.step ? '<span class="visually-hidden"> (done)</span>' : ''}</span></li>`).join('');

        $('#log-errors', root).innerHTML = '';
        $('#back', root).style.visibility = st.step === 1 ? 'hidden' : 'visible';
        $('#fwd', root).innerHTML = st.step === 1 ? `Next: Recipe${ic('right')}` : st.step === 2 ? `Next: Brew &amp; taste${ic('right')}` : `${ic('check')}Save brew`;
        if (focusHeading) { const lg = $('legend', root); if (lg) { lg.tabIndex = -1; lg.focus(); } }
      };
      const err = (name, msg) => { const el = $(`#e-${name}`, root); if (el) el.innerHTML = msg ? ic('alert', 'icon--sm') + msg : ''; };

        st.dirty = true;
        if (e.target.name === 'coffee') { st.coffee = e.target.value; err('coffee'); }
        if (e.target.name === 'recipe') { st.recipe = e.target.value; applyRecipe(); err('recipe'); }
        if (e.target.name === 'rating') {
          st.rating = +e.target.value; err('rating');

          $('#rating-value', root).textContent = `${st.rating} / 5`;
        }
      });
      form.addEventListener('input', e => {
        st.dirty = true;
        const n = e.target.name;
        if (['dose', 'water', 'temp'].includes(n)) {
          save(); $('#ratio', root).textContent = ratio(+st.dose, +st.water);
          const h = $(`#h-${n}`, root); h.textContent = e.target.value != h.dataset.orig ? `Changed from ${h.dataset.orig} ${h.dataset.unit}` : 'From the recipe'; h.classList.toggle('changed', e.target.value != h.dataset.orig);
        }
        if (n?.startsWith('s-')) { const k = n.slice(2); $(`#o-${k}`, root).textContent = `${e.target.value} / 5`; e.target.setAttribute('aria-valuetext', `${e.target.value} out of 5`); }
        // Clear a time error as soon as the value is fixed (while typing), never on blur: collapsing it on blur shifts the layout under the pointer.
        if (n === 'time' && e.target.getAttribute('aria-invalid') === 'true' && (!e.target.value.trim() || parseMmss(e.target.value) !== null)) { e.target.setAttribute('aria-invalid', 'false'); err('time', ''); }
      });
      form.addEventListener('focusout', e => { if (e.target.name === 'time') { const v = e.target.value.trim(); if (v && parseMmss(v) === null) { e.target.setAttribute('aria-invalid', 'true'); err('time', 'Use minutes:seconds, for example 3:30.'); } } });
      root.addEventListener('click', e => {
        const m = e.target.closest('[data-m]'); if (m) { st.method = m.dataset.m; draw(); $(`[data-m="${st.method}"]`, root).focus(); }
        const g = e.target.closest('[data-goto]'); if (g) { e.preventDefault(); save(); st.step = +g.dataset.goto; draw(true); }
        const a = e.target.closest('[data-focus]'); if (a) { e.preventDefault(); const el = document.getElementById(a.dataset.focus); el.closest('details')?.setAttribute('open', ''); el.focus(); }
      });
      $('#back', root).addEventListener('click', () => { save(); st.step--; draw(true); });
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (st.step === 1) { if (!st.coffee) { err('coffee', 'Choose a coffee to continue.'); $('input[name=coffee]', root)?.focus(); return; } st.step = 2; return draw(true); }
        if (st.step === 2) { if (!st.recipe) { err('recipe', 'Choose a recipe to continue.'); $('input[name=recipe]', root)?.focus(); return; } st.step = 3; return draw(true); }
        save();
        const problems = [];
        if (!st.rating) { problems.push(['rate-1', 'Rate this brew from 1 to 5 stars.']); err('rating', 'Rate this brew from 1 to 5 stars.'); }
        if (st.time && parseMmss(st.time) === null) { problems.push(['f-time', 'Enter the total time as minutes:seconds, for example 3:30.']); err('time', 'Use minutes:seconds, for example 3:30.'); }
        if (problems.length) {
          $('#log-errors', root).innerHTML = `<div class="error-summary" tabindex="-1" role="alert"><h2>${ic('alert')}There ${problems.length === 1 ? 'is a problem' : `are ${problems.length} problems`}</h2><ul>${problems.map(([id, m]) => `<li><a href="#${id}" data-focus="${id}">${m}</a></li>`).join('')}</ul></div>`;
          $('.error-summary', root).focus();
          return;
        }
        const b = { id: 'b' + Date.now(), date: TODAY.toISOString().slice(0, 10) + 'T' + new Date().toTimeString().slice(0, 5), coffee: st.coffee, recipe: st.recipe,
          dose: +st.dose, water: +st.water, temp: +st.temp, grinder: st.grinder, time: parseMmss(st.time) || 0, rating: st.rating,
          sensory: $('details.more', root)?.open ? { ...st.sensory } : {}, notes: st.notes, next: st.next };
        brews.push(b);
        st.dirty = false;
        toast(`Brew saved — ${plural(b.rating, 'star')} for ${byId(coffees, b.coffee).name}.`);
        location.hash = `#/history?new=${b.id}`;
      });
      guard = () => !st.dirty || confirm('Discard this brew log? Your entries will be lost.');
      draw();
      return () => { guard = null; };
    } };
}

function History(q) {

            <p class="stat-line"><span>${best.dose} g</span><span>${best.water} g</span><span>${ratio(best.dose, best.water)}</span><span>${best.temp} °C</span><span>${esc(best.grinder || '')}</span></p>
            ${c.status === 'active' ? `<div class="actions"><a class="btn btn-primary" href="#/log?coffee=${c.id}&recipe=${r.id}">${ic('reset')}Brew it again</a></div>` : ''}
          </div>`;
        } else $('#hist-best', root).innerHTML = '';
        $('#hist-results', root).innerHTML = list.length ? `<ul class="brew-list">${list.map(b => brewItem(b, { open: b.id === isNew, isNew: b.id === isNew })).join('')}</ul>` :

    } };

/* ===== Router ===== */
let cleanup = null, guard = null, prevHash = location.hash, ignoreNext = false, firstRender = true;
function parseHash() {
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(qs || '') };
}
function render() {
  if (cleanup) { cleanup(); cleanup = null; }
  const { parts: [a, b, c], q } = parseHash();
  const view =
    !a ? Home() :
    a === 'coffees' && b === 'new' ? CoffeeForm(q) :
    a === 'coffees' && b ? CoffeeDetail(b) :
    a === 'coffees' ? Coffees(q) :
    a === 'recipes' && b && c === 'guide' ? Guide(b) :
    a === 'recipes' && b ? RecipeDetail(b) :
    a === 'recipes' ? Recipes(q) :
    a === 'log' ? LogBrew(q) :
    a === 'history' ? History(q) :
    a === 'signin' ? SignIn() :
    a === 'styleguide' ? StyleGuide() : NotFound();
  document.body.classList.toggle('focus-mode', !!view.focus);
  $$('[data-nav]').forEach(el => el.dataset.nav === view.nav ? el.setAttribute('aria-current', 'page') : el.removeAttribute('aria-current'));
  document.title = `${view.title} · Coffee Nerds`;
  const root = $('#view');
  root.innerHTML = view.html;
  root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter');
  if (view.mount) cleanup = view.mount.call({}, root) || null;
  if (!firstRender) { window.scrollTo(0, 0); $('h1', root)?.focus({ preventScroll: true }); }
  firstRender = false;
}
window.addEventListener('hashchange', () => {
  if (ignoreNext) { ignoreNext = false; return; }
  if (guard && !guard()) { ignoreNext = true; location.hash = prevHash; return; }
  prevHash = location.hash;
  render();
});

/* ===== Theme ===== */
function currentTheme() { return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function paintToggles() {
  const dark = currentTheme() === 'dark';
  $$('.theme-toggle').forEach(b => {
    const label = dark ? 'Switch to light theme' : 'Switch to dark theme';
    b.setAttribute('aria-label', label);
    b.innerHTML = b.classList.contains('icon-btn') ? ic(dark ? 'sun' : 'moon') : `${ic(dark ? 'sun' : 'moon')}${dark ? 'Light theme' : 'Dark theme'}`;
  });
}
try { const saved = localStorage.getItem('cn-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (_) { /* storage unavailable */ }
document.addEventListener('click', e => {
  if (!e.target.closest('.theme-toggle')) return;
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('cn-theme', next); } catch (_) { /* storage unavailable */ }
  paintToggles();
  if (parseHash().parts[0] === 'styleguide') render();
});
paintToggles();
render();
</script>
</body>
</html>
